<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Yassir Kniksi Portfolio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080b12;--card:#111722;--input:#0b1018;--text:#f5f7fb;--muted:#9aa6b8;--border:#273142;--accent:#7657ff;--danger:#ef4444;--success:#22c55e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:25px;box-shadow:0 15px 50px rgba(0,0,0,.35)}.login{width:min(420px,100%)}.login h1{margin:0 0 8px}.muted{color:var(--muted)}
label{display:block;margin:15px 0 7px;font-weight:600}input,textarea{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--input);color:var(--text);outline:none}input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(118,87,255,.12)}textarea{min-height:120px;resize:vertical}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700}.primary{background:var(--accent);color:#fff}.secondary{background:#202938;color:#fff;border:1px solid var(--border)}.danger{background:#35161a;color:#fecaca;border:1px solid #642329}.msg{margin-top:14px;padding:11px;border-radius:9px}.error{background:#3a171b;color:#fecaca}.success{background:#12351f;color:#bbf7d0}
header{height:68px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 25px;position:sticky;top:0;background:rgba(8,11,18,.94);backdrop-filter:blur(10px);z-index:5}.brand{font-weight:800;display:flex;align-items:center}.brand span{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#7657ff,#00c8ff);margin-right:9px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
main{max-width:1200px;margin:auto;padding:30px 20px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.grid{display:grid;grid-template-columns:380px 1fr;gap:20px}.project{padding:18px;border:1px solid var(--border);border-radius:14px;margin-bottom:12px;background:#0e141e}.project-top{display:flex;justify-content:space-between;gap:10px}.project h3{margin:0 0 7px}.meta{color:var(--muted);font-size:13px;margin-bottom:8px}.empty{text-align:center;padding:40px;color:var(--muted)}
@media(max-width:800px){.grid{grid-template-columns:1fr}header{padding:0 14px}.email{display:none}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>

<section id="loginScreen" class="center">
  <div class="card login">
    <h1>Administration</h1>
    <p class="muted">Connexion à votre portfolio Supabase.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email" placeholder="votre@email.com">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••">
      <button type="submit" class="btn primary" style="width:100%;margin-top:18px">Se connecter</button>
    </form>
    <div id="loginMsg"></div>
  </div>
</section>

<section id="adminApp" class="hidden">
<header>
  <div class="brand"><span>YK</span> Portfolio Admin</div>
  <div class="actions">
    <span id="userEmail" class="muted email"></span>
    <button id="logoutBtn" class="btn secondary">Déconnexion</button>
  </div>
</header>

<main>
  <div class="head">
    <div>
      <h1>Projets</h1>
      <p class="muted">Ajoutez et gérez vos projets depuis Supabase.</p>
    </div>
    <button id="newBtn" class="btn primary">+ Nouveau projet</button>
  </div>

  <div class="grid">
    <div class="card">
      <h2 id="formTitle">Nouveau projet</h2>
      <form id="projectForm">
        <input id="projectId" type="hidden">

        <label for="title">Titre</label>
        <input id="title" required placeholder="Pneumonia Detection">

        <label for="description">Description</label>
        <textarea id="description" required placeholder="Description du projet..."></textarea>

        <label for="category">Catégorie</label>
        <input id="category" required placeholder="AI">

        <label for="technologies">Technologies</label>
        <input id="technologies" placeholder="PyTorch, ResNet-18, Computer Vision">

        <label for="image_url">URL de l'image</label>
        <input id="image_url" type="url" placeholder="https://...">

        <label for="project_url">URL du projet</label>
        <input id="project_url" type="url" placeholder="https://github.com/...">

        <div class="actions" style="margin-top:18px">
          <button type="submit" class="btn primary" id="saveBtn">Enregistrer</button>
          <button type="button" class="btn secondary" id="cancelBtn">Annuler</button>
        </div>
        <div id="formMsg"></div>
      </form>
    </div>

    <div><div id="projectsList"></div></div>
  </div>
</main>
</section>

<script>
const SUPABASE_URL = "https://hoznruaicisrrjwyuxbo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Vw6DbHDXyl4RQz40vAiOsA_salxZJ1e";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function showMessage(id,text,type="error"){
  $(id).innerHTML = text ? `<div class="msg ${type}">${escapeHtml(text)}</div>` : "";
}

async function checkSession(){
  const {data:{session}} = await supabaseClient.auth.getSession();

  if(session){
    $("loginScreen").classList.add("hidden");
    $("adminApp").classList.remove("hidden");
    $("userEmail").textContent = session.user.email || "";
    loadProjects();
  }else{
    $("loginScreen").classList.remove("hidden");
    $("adminApp").classList.add("hidden");
  }
}

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  showMessage("loginMsg","");

  const {error} = await supabaseClient.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });

  if(error){
    showMessage("loginMsg",error.message);
    return;
  }

  $("password").value="";
  await checkSession();
});

$("logoutBtn").addEventListener("click",async()=>{
  await supabaseClient.auth.signOut();
  resetForm();
  await checkSession();
});

supabaseClient.auth.onAuthStateChange((_event,session)=>{
  if(session){
    $("loginScreen").classList.add("hidden");
    $("adminApp").classList.remove("hidden");
    $("userEmail").textContent=session.user.email||"";
  }else{
    $("loginScreen").classList.remove("hidden");
    $("adminApp").classList.add("hidden");
  }
});

async function loadProjects(){
  $("projectsList").innerHTML='<div class="card">Chargement...</div>';

  const {data,error} = await supabaseClient
    .from("projects")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    $("projectsList").innerHTML=`<div class="card"><div class="msg error">${escapeHtml(error.message)}</div></div>`;
    return;
  }

  if(!data || !data.length){
    $("projectsList").innerHTML='<div class="card empty">Aucun projet pour le moment.</div>';
    return;
  }

  $("projectsList").innerHTML=data.map(project=>`
    <article class="project">
      <div class="project-top">
        <div>
          <h3>${escapeHtml(project.title)}</h3>
          <div class="meta">${escapeHtml(project.category || "")}</div>
        </div>
        <div class="actions">
          <button class="btn secondary" onclick="editProject(${project.id})">Modifier</button>
          <button class="btn danger" onclick="deleteProject(${project.id})">Supprimer</button>
        </div>
      </div>
      <p>${escapeHtml(project.description || "")}</p>
      <div class="meta"><strong>Technologies :</strong> ${escapeHtml(project.technologies || "—")}</div>
      ${project.project_url ? `<a href="${escapeHtml(project.project_url)}" target="_blank" rel="noopener" class="muted">Voir le projet ↗</a>` : ""}
    </article>
  `).join("");
}

async function editProject(id){
  const {data,error} = await supabaseClient
    .from("projects").select("*").eq("id",id).single();

  if(error){
    showMessage("formMsg",error.message);
    return;
  }

  $("projectId").value=data.id;
  $("title").value=data.title || "";
  $("description").value=data.description || "";
  $("category").value=data.category || "";
  $("technologies").value=data.technologies || "";
  $("image_url").value=data.image_url || "";
  $("project_url").value=data.project_url || "";
  $("formTitle").textContent="Modifier le projet";
  $("saveBtn").textContent="Mettre à jour";
  showMessage("formMsg","");
  window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteProject(id){
  if(!confirm("Voulez-vous vraiment supprimer ce projet ?")) return;

  const {error}=await supabaseClient.from("projects").delete().eq("id",id);

  if(error){
    alert("Erreur : "+error.message);
    return;
  }

  await loadProjects();
}

$("projectForm").addEventListener("submit",async e=>{
  e.preventDefault();
  showMessage("formMsg","");
  $("saveBtn").disabled=true;

  const payload={
    title:$("title").value.trim(),
    description:$("description").value.trim(),
    category:$("category").value.trim(),
    technologies:$("technologies").value.trim(),
    image_url:$("image_url").value.trim() || null,
    project_url:$("project_url").value.trim() || null
  };

  const id=$("projectId").value;
  let result;

  if(id){
    result=await supabaseClient.from("projects").update(payload).eq("id",id);
  }else{
    result=await supabaseClient.from("projects").insert(payload);
  }

  $("saveBtn").disabled=false;

  if(result.error){
    showMessage("formMsg",result.error.message);
    return;
  }

  showMessage("formMsg",id ? "Projet mis à jour avec succès." : "Projet ajouté avec succès.","success");
  resetForm();
  await loadProjects();
});

function resetForm(){
  $("projectForm").reset();
  $("projectId").value="";
  $("formTitle").textContent="Nouveau projet";
  $("saveBtn").textContent="Enregistrer";
  showMessage("formMsg","");
}

$("newBtn").addEventListener("click",()=>{
  resetForm();
  window.scrollTo({top:0,behavior:"smooth"});
});

$("cancelBtn").addEventListener("click",resetForm);

checkSession();
</script>

</body>
</html>
